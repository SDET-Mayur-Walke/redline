# Generated by `python -m redline.ablation --rule` from the step 11 run: the pre-registered rule in
# docs/results/ablation_plan.md, applied as written. default.yaml with exactly these switches on:
# ingestion_scanner, tool_authz, refund_rules, confirm_side_effects, egress_filter, output_filter. Results: docs/results/ablation.md.
models:
  agent: qwen3:8b
  judge: qwen2.5:7b
  embed: nomic-embed-text
  ollama_base_url: http://localhost:11434
retrieval:
  qdrant_path: data/qdrant
  collection: kb
  chunk_tokens: 150
  max_chunk_tokens: 500
  embed_batch: 32
  top_k_prefetch: 20
  top_k: 5
  rrf_k: 60
  sparse_model: Qdrant/bm25
  rerank: true
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2
  index_metadata: true
  staff_filter: false
agent:
  prompt: support_v3
  temperature: 0.2
  max_steps: 8
  num_ctx: 16384
  think: false
  auto_retrieve: true
  timeout: 180.0
defenses:
  unicode_normalize: false
  injection_classifier: false
  injection_model: protectai/deberta-v3-base-prompt-injection-v2
  injection_threshold: 0.9
  guard_llm: false
  guard_model: llama-guard3:1b
  ingestion_scanner: true
  spotlight: false
  tool_authz: true
  refund_rules: true
  confirm_side_effects: true
  egress_filter: true
  egress_allowlist:
  - localhost:8000
  - 127.0.0.1:8000
  output_filter: true
  overlap_ngram: 8
  overlap_min_words: 40
dev_endpoints: false
