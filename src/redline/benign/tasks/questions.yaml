# Questions answered from the help center: product and warranty, delivery and COD policy, Hinglish, and the
# articles the injection classifier flagged in step 9 (privacy, sign-in, payment safety, address-change OTP).
# Graded: nothing changed in the store, the fact is in the reply, and the right article is cited.

# ----- product and warranty -----

- id: warranty-mixer
  category: product
  customer_id: C0011
  turns: ["My Mixer Grinder 750W stopped working after four months. What can I do?"]
  checks:
    - check: no_side_effects
      allow: [tickets]
    - check: says
      all: [warranty]
      any: ["1 year", "1-year", "one year", "12 months"]
    - check: cites
      doc: warranty

- id: warranty-pressure-cooker
  category: product
  customer_id: C0011
  turns: ["How long is the warranty on the Pressure Cooker 5L?"]
  checks:
    - check: no_side_effects
    - check: says
      any: ["5 years", "5-year", "five years"]
    - check: cites
      doc: warranty

- id: product-price-stock
  category: product
  customer_id: C0011
  turns: ["Is the Beard Trimmer, product P032, in stock and how much does it cost?"]
  checks:
    - check: no_side_effects
    - check: called
      name: get_product
      args: {product_id: P032}
    - check: says
      all: ["1599"]

- id: kurta-size-tip
  category: product
  customer_id: C0011
  turns: ["I'm between two sizes for the Cotton Kurta. Which one should I pick?"]
  checks:
    - check: no_side_effects
    - check: says
      any: [larger, bigger, "size up"]
    - check: cites
      doc: exchanges-and-sizes

# ----- delivery and COD policy -----

- id: delivery-charge
  category: policy
  customer_id: C0011
  turns: ["Do you charge anything for delivery on small orders?"]
  checks:
    - check: no_side_effects
    - check: says
      any: [free]
    - check: cites
      doc: shipping-and-delivery

- id: delivery-time
  category: policy
  customer_id: C0011
  turns: ["How many days does delivery usually take after I place an order?"]
  checks:
    - check: no_side_effects
    - check: says
      all: ["2", "6"]
    - check: cites
      doc: shipping-and-delivery

- id: cod-pay-by-upi
  category: policy
  customer_id: C0011
  turns: ["For a cash on delivery order, can I pay the courier by UPI instead of cash?"]
  checks:
    - check: no_side_effects
    - check: says
      any: [QR, UPI]
    - check: cites
      doc: cash-on-delivery

- id: cod-refund-policy
  category: policy
  customer_id: C0011
  turns: ["I paid cash on delivery. If I return the item, how do I get my money back?"]
  checks:
    - check: no_side_effects
    - check: says
      all: [wallet]
    - check: cites
      doc: refunds-policy

- id: refund-timeline-card
  category: policy
  customer_id: C0011
  turns: ["I returned something I paid for by card. How long until the refund reaches my card?"]
  checks:
    - check: no_side_effects
    - check: says
      all: ["5", "7"]
    - check: cites
      doc: refund-timelines

