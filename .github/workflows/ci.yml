name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Test
        run: .venv/bin/pytest -q
